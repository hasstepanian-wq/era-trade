<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЭТП ЭРА — Электронная торговая площадка</title>
    <style>
        :root { 
            --primary: #0099d5; 
            --dark-bg: #01040a; 
            --sidebar-bg: #06162c;
            --glass: rgba(255, 255, 255, 0.08); 
            --glass-hover: rgba(255, 255, 255, 0.15);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body, html { 
            min-height: 100vh;
            background: var(--dark-bg); 
            color: #fff; 
            overflow-x: hidden;
        }

        /* --- ШИРОКИЙ ХЕДЕР --- */
        header { 
            background: #fff; 
            padding: 12px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            position: sticky; 
            top: 0;
        }
        
        .logo-section { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .logo-img { height: 38px; display: block; }
        .server-time { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 900; color: #1a202c; margin-top: 2px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .lang-switcher { display: flex; border: 1px solid #cbd5e0; border-radius: 20px; overflow: hidden; background: #fff; }
        .lang-btn { padding: 5px 10px; font-size: 10px; font-weight: bold; cursor: pointer; border: none; background: transparent; color: #64748b; transition: 0.2s; }
        .lang-btn.active { background: var(--primary); color: #fff; }
        
        .btn-login { background: var(--primary); color: #fff; padding: 10px 22px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; transition: 0.3s; }
        .btn-login:hover { background: #007bb1; transform: translateY(-1px); }

        /* --- ГЛАВНАЯ СТРАНИЦА (LANDING) --- */
        #landing-page { display: flex; flex-direction: column; min-height: 100vh; }
        
        main { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('sky_banner.jpg') no-repeat center/cover; 
            padding: 60px 20px;
        }
        
        /* СЕТКА: ПЛИТКИ -15% И УВЕЛИЧЕННЫЙ GAP */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 35px; 
            width: 100%; 
            max-width: 850px; /* Уменьшено */
            z-index: 10;
        }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 22px;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 25px; 
            text-align: center; 
            aspect-ratio: 1/1; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer;
        }
        .glass-card:hover { border-color: var(--primary); transform: translateY(-10px); background: var(--glass-hover); }
        .glass-card h3 { font-size: 17px; margin-bottom: 12px; text-transform: uppercase; font-weight: 800; color: #fff; }
        .glass-card p { font-size: 12px; color: #cbd5e0; line-height: 1.5; }

        /* --- ШИРОКИЙ ФУТЕР --- */
        footer { 
            background: #01040a; 
            padding: 50px 5% 30px; 
            border-top: 1px solid #1e293b; 
        }
        .footer-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .footer-col h4 { color: var(--primary); margin-bottom: 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .footer-col p, .footer-col li { font-size: 12px; color: #94a3b8; line-height: 1.8; list-style: none; }
        .copyright { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 10px; color: #475569; }

        /* --- ЛИЧНЫЙ КАБИНЕТ (DASHBOARD) --- */
        #dashboard { 
            display: none; 
            min-height: 100vh; 
            grid-template-columns: 260px 1fr; 
            background: #01040a; 
        }
        
        .sidebar { 
            background: var(--sidebar-bg); 
            border-right: 1px solid #1e293b; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            position: sticky;
            top: 0;
            height: 100vh;
        }
        
        .sidebar-logo { color: var(--primary); font-size: 22px; font-weight: 800; margin-bottom: 40px; text-align: center; }
        
        .side-link { 
            padding: 14px 18px; 
            color: #cbd5e0; 
            border-radius: 10px; 
            margin-bottom: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
            transition: 0.3s;
        }
        .side-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .side-link.active { background: var(--primary); color: #fff; }
        
        .main-content { padding: 50px; overflow-y: auto; }
        
        /* Блоки контента внутри кабинета */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Карточка финансов */
        .fin-card {
            background: #0a1f3d; 
            padding: 35px; 
            border-radius: 20px; 
            border: 1px solid #1e293b; 
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 768px) {
            #dashboard { grid-template-columns: 1fr; }
            .sidebar { display: none; } /* Для простоты в этом коде мобильный сайдбар скрыт */
            .grid-container { grid-template-columns: 1fr; max-width: 280px; gap: 20px; }
            .glass-card { aspect-ratio: auto; padding: 25px; }
            header { padding: 10px 15px; }
            .logo-img { height: 30px; }
        }
    </style>
</head>
<body>

<div id="landing-page">
    <header>
        <div class="logo-section" onclick="location.reload()">
            <img src="logo-forsage-modified.png" class="logo-img" alt="ЭТП ЭРА">
            <div id="clock" class="server-time">00:00:00 МСК</div>
        </div>
        <div class="header-right">
            <div class="lang-switcher">
                <button class="lang-btn" id="btn-ru" onclick="setUserLang('ru')">RU</button>
                <button class="lang-btn" id="btn-en" onclick="setUserLang('en')">EN</button>
            </div>
            <button class="btn-login" onclick="enterApp()">Вход</button>
        </div>
    </header>

    <main>
        <div class="grid-container">
            <div class="glass-card" onclick="enterApp()">
                <h3 data-i18n="c1_t">Участник</h3>
                <p data-i18n="c1_p">Поиск актуальных процедур и подача заявок онлайн.</p>
            </div>
            <div class="glass-card" onclick="enterApp()" style="border-color: var(--primary); border-width: 2px;">
                <h3 data-i18n="c2_t">Регистрация</h3>
                <p data-i18n="c2_p">Получите аккредитацию в системе за 24 часа.</p>
            </div>
            <div class="glass-card" onclick="enterApp()">
                <h3 data-i18n="c3_t">Организатор</h3>
                <p data-i18n="c3_p">
