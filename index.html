<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЭТП ЭРА</title>
    <style>
        :root { --primary: #0099d5; --dark-bg: #01040a; --glass: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        
        body, html { 
            min-height: 100vh;
            background: var(--dark-bg); color: #fff; 
            display: flex; flex-direction: column; 
        }

        /* ХЕДЕР */
        header { 
            background: #fff; padding: 15px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.15); flex-shrink: 0;
            position: sticky; top: 0;
        }
        
        .logo-section { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .logo-img { height: 40px; }
        .server-time { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 900; color: #1a202c; margin-top: 4px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .lang-switcher { display: flex; border: 1px solid #cbd5e0; border-radius: 20px; overflow: hidden; background: #fff; }
        .lang-btn { padding: 6px 12px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; background: transparent; color: #64748b; }
        .lang-btn.active { background: var(--primary); color: #fff; }
        
        .btn-login { background: var(--primary); color: #fff; padding: 10px 22px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; z-index: 1001; }

        /* КОНТЕНТ */
        #landing-page { flex: 1; display: flex; flex-direction: column; width: 100%; }
        main { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('sky_banner.jpg') no-repeat center/cover; 
            padding: 50px 20px; position: relative;
        }
        
        .grid-container { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 25px; width: 100%; max-width: 1000px; 
            position: relative; z-index: 999; /* Вытащил на передний план */
        }
        
        .glass-card { 
            background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            display: flex; flex-direction: column; justify-content: center; 
            padding: 30px; text-align: center; aspect-ratio: 1/1; transition: 0.3s; cursor: pointer;
            pointer-events: auto; /* Явное разрешение кликов */
        }
        .glass-card:hover { border-color: var(--primary); transform: translateY(-5px); background: rgba(255, 255, 255, 0.15); }
        .glass-card h3 { font-size: 19px; margin-bottom: 12px; text-transform: uppercase; pointer-events: none; }
        .glass-card p { font-size: 13px; color: #cbd5e0; line-height: 1.5; pointer-events: none; }

        /* ФУТЕР */
        footer { 
            background: #01040a; padding: 40px 5%; 
            border-top: 1px solid #1e293b; flex-shrink: 0;
        }
        .footer-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 30px; max-width: 1200px; margin: 0 auto; 
        }
        .footer-col h4 { color: var(--primary); margin-bottom: 15px; font-size: 14px; text-transform: uppercase; }
        .footer-col p, .footer-col li { font-size: 12px; color: #94a3b8; line-height: 1.6; list-style: none; }

        /* ЛИЧНЫЙ КАБИНЕТ */
        #dashboard { display: none; min-height: 100vh; grid-template-columns: 260px 1fr; background: #01040a; }
        .sidebar { background: #06162c; border-right: 1px solid #1e293b; padding: 30px 20px; }
        .side-link { padding: 15px; color: #cbd5e0; border-radius: 8px; margin-bottom: 10px; cursor: pointer; font-weight: 600; }
        .side-link.active { background: var(--primary); color: #fff; }
        .main-content { padding: 40px; color: #fff; }
