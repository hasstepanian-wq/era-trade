<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ваш Проект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <div class="sq"></div>
        <span>ТВОЁ НАЗВАНИЕ</span>
    </div>
    <div class="h-right">
        <span id="live-clock">00:00:00</span>
        <span>ТВОЙ ТЕЛЕФОН</span>
    </div>
</header>

<main>
    <div class="stats-row">
        <div class="card">
            <label>БЛОК 1</label>
            <div class="val">ТВОЙ ТЕКСТ 1</div>
        </div>
        <div class="card">
            <label>БЛОК 2</label>
            <div class="val">ТВОЙ ТЕКСТ 2</div>
        </div>
        <div class="card">
            <label>БЛОК 3</label>
            <div class="val">ТВОЙ ТЕКСТ 3</div>
        </div>
    </div>

    <div class="hero-block" style="background-image: url('sky_banner.jpg');">
        <div class="hero-inner">
            <h1>ТВОЙ ГЛАВНЫЙ ЗАГОЛОВОК</h1>
            <p>ТВОЁ ОПИСАНИЕ ЗДЕСЬ</p>
            <button onclick="generateInvoice(100000)">КНОПКА ДЕЙСТВИЯ</button>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 ТВОЯ КОМПАНИЯ</p>
</footer>

<script src="script.js"></script>
</body>
</html>
