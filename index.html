<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЭТП ЭРА</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="modal-overlay">
    <div class="modal-card">
        <h2>Вход в систему</h2>
        <input type="text" id="u-login" placeholder="Логин / ID">
        <input type="password" id="u-pass" placeholder="Пароль">
        <button class="btn-blue" onclick="enterSite()">Войти</button>
    </div>
</div>

<header>
    <div class="logo">
        <div class="blue-sq"></div>
        <span>ЭТП ЭРА</span>
    </div>
    <div class="h-right">
        <span id="live-clock">00:00:00</span>
        <span class="phone">8 (800) 555-35-35</span>
    </div>
</header>

<main>
    <div class="stats-container">
        <div class="card">
            <label>БЛОК 1</label>
            <div class="val">Текст 1</div>
        </div>
        <div class="card">
            <label>БЛОК 2</label>
            <div class="val">Текст 2</div>
        </div>
        <div class="card">
            <label>БЛОК 3</label>
            <div class="val">Текст 3</div>
        </div>
    </div>

    <div class="hero-banner" style="background-image: url('sky_banner.jpg');">
        <div class="hero-inner">
            <h1>ТВОЙ ЗАГОЛОВОК</h1>
            <p>Твое описание проекта</p>
            <button class="btn-blue" onclick="alert('Счет сформирован!')">ДЕЙСТВИЕ</button>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 ЭТП ЭРА</p>
</footer>

<script src="script.js"></script>
</body>
</html>
