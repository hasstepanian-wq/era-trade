<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭТП ЭРА</title>
    <style>
        :root { --primary: #0099d5; --dark: #06162c; }
        body, html { margin: 0; padding: 0; font-family: Arial, sans-serif; background: var(--dark); color: #fff; }

        /* ТВОЙ ХЕДЕР */
        header {
            background: #fff; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--primary);
        }
        .header-center { display: flex; flex-direction: column; align-items: center; margin: 0 auto; }
        .logo-img { height: 70px; width: auto; }
        .server-time { font-family: monospace; font-size: 16px; color: #333; font-weight: bold; margin-top: 5px; }
        .btn-top { background: var(--primary); color: #fff; padding: 12px 25px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }

        /* ТВОЙ БЛОК С БАННЕРОМ */
        .hero { width: 100%; height: 400px; background: url('sky_banner.jpg') no-repeat center center; background-size: cover; }

        /* ТВОИ БЛОКИ (КОНТЕНТ) */
        .main-grid { max-width: 1200px; margin: -50px auto 50px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; padding: 0 20px; }
        .block-item { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); padding: 40px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: center; }
        .block-item:hover { border-color: var(--primary); background: rgba(0, 153, 213, 0.1); }
        .block-item h3 { color: var(--primary); text-transform: uppercase; margin-top: 0; }

        /* ТВОЙ ФУТЕР */
        footer { background: #030a16; padding: 40px 5%; border-top: 1px solid var(--primary); text-align: center; color: #666; font-size: 14px; }

        /* УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: #fff; color: #333; padding: 35px; border-radius: 8px; width: 100%; max-width: 400px; position: relative; }
        .modal-box h2 { margin: 0 0 20px 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .type-btn { border: 1px solid #ccc; padding: 10px; cursor: pointer; text-align: center; font-size: 13px; font-weight: bold; }
        .type-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .btn-submit { background: var(--primary); color: #fff; border: none; width: 100%; padding: 15px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .close-modal { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 24px; color: #ccc; }
    </style>
</head>
<body>

<header>
    <div style="width:150px"></div>
    <div class="header-center">
        <img src="logo-forsage-modified.png" alt="LOGO" class="logo-img">
        <div class="server-time" id="server-time">00:00:00</div>
    </div>
    <div style="width:150px; text-align:right;">
        <button class="btn-top" onclick="toggleM(true)">ВХОД</button>
    </div>
</header>

<div class="hero"></div>

<div class="main-grid">
    <div class="block-item" onclick="toggleM(true)">
        <h3>Участник</h3>
        <p>Доступ к закупкам и подача заявок</p>
    </div>
    <div class="block-item" onclick="toggleM(true)" style="border-color: var(--primary)">
        <h3>Регистрация</h3>
        <p>Аккредитация в системе за 24 часа</p>
    </div>
    <div class="block-item" onclick="toggleM(true)">
        <h3>Организатор</h3>
        <p>Размещение лотов и ведение торгов</p>
    </div>
</div>

<footer>
    <p>&copy; 2026 ЭТП ЭРА. Все права защищены. Система электронных торгов.</p>
</footer>

<div id="modal" class="modal-overlay">
    <div class="modal-box">
        <span class="close-modal" onclick="toggleM(false)">&times;</span>
        <h2>Авторизация</h2>
        
        <div class="type-selector">
            <div id="btn-org" class="type-btn active" onclick="switchMode('org')">ЮР. ЛИЦО</div>
            <div id="btn-fiz" class="type-btn" onclick="switchMode('fiz')">ФИЗ. ЛИЦО</div>
        </div>

        <div class="input-group">
            <label id="label-id">ИНН ОРГАНИЗАЦИИ</label>
            <input type="text" id="input-id" placeholder="10 или 12 цифр">
        </div>
        <div class="input-group">
            <label>ПАРОЛЬ</label>
            <input type="password" placeholder="********">
        </div>
        
        <button class="btn-submit" onclick="toggleM(false)">ВОЙТИ</button>
    </div>
</div>

<script>
    function updateClock() {
        document.getElementById('server-time').innerText = new Date().toLocaleTimeString('ru-RU', {timeZone: 'Europe/Moscow'});
    }
    setInterval(updateClock, 1000); updateClock();

    function toggleM(s) { document.getElementById('modal').style.display = s ? 'flex' : 'none'; }

    function switchMode(mode) {
        const isOrg = mode === 'org';
        document.getElementById('btn-org').classList.toggle('active', isOrg);
        document.getElementById('btn-fiz').classList.toggle('active', !isOrg);
        document.getElementById('label-id').innerText = isOrg ? 'ИНН ОРГАНИЗАЦИИ' : 'СНИЛС / ИНН ФИЗЛИЦА';
        document.getElementById('input-id').placeholder = isOrg ? '10 или 12 цифр' : 'ХХХ-ХХХ-ХХХ ХХ';
    }

    window.onclick = function(e) { if (e.target.className === 'modal-overlay') toggleM(false); }
</script>

</body>
</html>
