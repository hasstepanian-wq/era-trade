<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЭТП ЭРА</title>
    <style>
        :root { --primary: #0099d5; --dark-bg: #01040a; --glass: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        
        html, body { 
            height: 100%;
            min-height: 100vh;
            background: var(--dark-bg); 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Запрет скролла на ПК */
        }

        /* УВЕЛИЧЕННЫЙ ХЕДЕР */
        header { 
            background: #fff; 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            flex-shrink: 0;
        }
        
        .logo-section { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .logo-img { height: 40px; } /* Лого крупнее */
        .server-time { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 900; color: #1a202c; margin-top: 4px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .lang-switcher { display: flex; border: 1px solid #cbd5e0; border-radius: 20px; overflow: hidden; background: #fff; }
        .lang-btn { padding: 6px 12px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; background: transparent; color: #64748b; transition: 0.2s; }
        .lang-btn.active { background: var(--primary); color: #fff; }
        
        .btn-login { background: var(--primary); color: #fff; padding: 10px 22px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.3s; }
        .btn-login:hover { background: #007bb1; transform: translateY(-1px); }

        /* ЦЕНТРАЛЬНЫЙ БЛОК */
        main { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('sky_banner.jpg') no-repeat center/cover; 
            position: relative;
            padding: 20px;
        }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px; 
            width: 100%; 
            max-width: 1000px; 
        }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 30px; 
            text-align: center; 
            aspect-ratio: 1/1;
            transition: 0.3s;
            cursor: pointer;
        }
        .glass-card:hover { border-color: var(--primary); background: rgba(255, 255, 255, 0.12); transform: scale(1.03); }
        .glass-card h3 { font-size: 19px; margin-bottom: 12px; text-transform: uppercase; font-weight: 800; }
        .glass-card p { font-size: 13px; color: #cbd5e0; line-height: 1.5; }

        /* ФИКСИРОВАННЫЙ ФУТЕР */
        footer { 
            background: #01040a; 
            padding: 20px; 
            border-top: 1px solid #1e293b; 
            text-align: center; 
            flex-shrink: 0;
        }
        .footer-text { font-size: 11px; color: #64748b; letter-spacing: 1px; text-transform: uppercase; }

        /* МОБИЛКА */
        @media (max-width: 768px) {
            html, body { overflow-y: auto; }
            .grid-container { grid-template-columns: 1fr; max-width: 300px; margin: 30px 0; }
            .glass-card { aspect-ratio: auto; padding: 25px; }
            .logo-img { height: 32px; }
            .btn-login { padding: 8px 15px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-section" onclick="location.reload()">
        <img src="logo-forsage-modified.png" class="logo-img">
        <div id="clock" class="server-time">00:00:00 МСК</div>
    </div>
    <div class="header-right">
        <div class="lang-switcher">
            <button class="lang-btn" id="btn-ru" onclick="setUserLang('ru')">RU</button>
            <button class="lang-btn" id="btn-en" onclick="setUserLang('en')">EN</button>
        </div>
        <button class="btn-login" onclick="loginAction()" data-i18n="b_login">Вход</button>
    </div>
</header>

<main>
    <div class="grid-container">
        <div class="glass-card" onclick="loginAction()">
            <h3 data-i18n="c1_t">Участник</h3>
            <p data-i18n="c1_p">Поиск актуальных процедур и подача заявок онлайн.</p>
        </div>
        <div class="glass-card" onclick="loginAction()" style="border-color: var(--primary); border-width: 2px;">
            <h3 data-i18n="c2_t">Регистрация</h3>
            <p data-i18n="c2_p">Получите аккредитацию в системе за 24 часа.</p>
        </div>
        <div class="glass-card" onclick="loginAction()">
            <h3 data-i18n="c3_t">Организатор</h3>
            <p data-i18n="c3_p">Размещение лотов и управление торгами.</p>
        </div>
    </div>
</main>

<footer>
    <p class="footer-text">© 2026 ЭТП ЭРА | ПОДДЕРЖКА: 8 (800) 555-35-35</p>
</footer>

<script>
    const dict = {
        ru: {
            b_login: "Вход", c1_t: "Участник", c1_p: "Поиск актуальных процедур и подача заявок онлайн.",
            c2_t: "Регистрация", c2_p: "Аккредитация в системе за 24 часа.",
            c3_t: "Организатор", c3_p: "Размещение лотов и управление торгами."
        },
        en: {
            b_login: "Login", c1_t: "Bidder", c1_p: "Search active procedures and submit bids online.",
            c2_t: "Registration", c2_p: "Get accredited in just 24 hours.",
            c3_t: "Organizer", c3_p: "Post lots and manage your auctions."
        }
    };

    function applyTranslations(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[lang][key]) el.innerText = dict[lang][key];
        });
        document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.documentElement.lang = lang;
    }

    function initLang() {
        const manual = localStorage.getItem('user_lang_pref');
        const systemLang = (navigator.language || navigator.userLanguage).toLowerCase();
        
        if (manual) {
            applyTranslations(manual);
        } else {
            const defaultLang = systemLang.includes('ru') ? 'ru' : 'en';
            applyTranslations(defaultLang);
        }
    }

    function setUserLang(lang) {
        localStorage.setItem('user_lang_pref', lang);
        applyTranslations(lang);
    }

    function updateTime() {
        const now = new Date();
        const str = now.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour12: false });
        document.getElementById('clock').innerText = str + ' МСК';
    }

    // РЕАЛЬНОЕ ДЕЙСТВИЕ ДЛЯ КНОПОК
    function loginAction() {
        // Здесь будет переход на страницу авторизации или появление окна
        console.log("Клик сработал");
        document.body.style.opacity = '0.5';
        setTimeout(() => {
            alert('Перенаправление в личный кабинет...');
            document.body.style.opacity = '1';
        }, 100);
    }

    window.onload = () => {
        initLang();
        updateTime();
        setInterval(updateTime, 1000);
    };
</script>
</body>
</html>
