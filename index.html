<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭТП ЭРА</title>
    <style>
        :root { --primary: #0099d5; --dark-bg: #06162c; }
        
        html, body { 
            height: 100%; 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--dark-bg); color: #fff; 
        }

        body { display: flex; flex-direction: column; }

        /* ХЕДЕР БЕЗ ГОЛУБОЙ ПОЛОСЫ */
        header {
            background: #ffffff; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            /* УБРАЛ border-bottom */
        }
        
        .header-center { display: flex; flex-direction: column; align-items: center; margin: 0 auto; }
        .logo-img { height: 75px; width: auto; display: block; }
        .server-time { font-family: monospace; font-size: 16px; color: #1a202c; font-weight: 900; margin-top: 2px; }
        
        .btn-top { 
            background: var(--primary); color: #fff; padding: 12px 25px; 
            border-radius: 4px; border: none; cursor: pointer; 
            font-weight: bold; text-transform: uppercase; 
        }

        /* БАННЕР */
        .hero-banner {
            width: 100%; height: 450px;
            background: url('sky_banner.jpg') no-repeat center center;
            background-size: cover;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        main { flex: 1 0 auto; }
        
        .container {
            max-width: 1200px; margin: -60px auto 60px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px; padding: 0 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px; border-radius: 8px; transition: 0.3s; cursor: pointer;
            backdrop-filter: blur(10px); text-align: center;
        }
        .card:hover { border-color: var(--primary); background: rgba(0, 153, 213, 0.15); transform: translateY(-5px); }
        .card h3 { color: var(--primary); margin-top: 0; text-transform: uppercase; }

        /* ФУТЕР ВНИЗУ */
        footer {
            flex-shrink: 0;
            background: #030a16; padding: 25px 5%;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center; color: #94a3b8; font-size: 14px;
        }

        /* УНИВЕРСАЛЬНАЯ МОДАЛКА */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: #fff; color: #1a202c; padding: 40px; border-radius: 4px; width: 90%; max-width: 400px; position: relative; }
        .modal-box h2 { margin: 0 0 25px 0; border-bottom: 3px solid var(--primary); padding-bottom: 10px; text-transform: uppercase; }
        
        .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .t-btn { border: 1px solid #cbd5e0; padding: 12px; cursor: pointer; text-align: center; font-weight: bold; font-size: 12px; color: #4a5568; }
        .t-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .input-item { margin-bottom: 20px; }
        .input-item label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 8px; color: #4a5568; }
        .input-item input { width: 100%; padding: 15px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }
        
        .btn-go { background: var(--primary); color: #fff; border: none; width: 100%; padding: 18px; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; }
        .x-close { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 30px; color: #cbd5e0; }
    </style>
</head>
<body>

<header>
    <div style="width:150px"></div>
    <div class="header-center">
        <img src="logo-forsage-modified.png" alt="LOGO" class="logo-img">
        <div class="server-time" id="clock">00:00:00</div>
    </div>
    <div style="width:150px; text-align:right;">
        <button class="btn-top" onclick="showM(true)">ВХОД</button>
    </div>
</header>

<main>
    <div class="hero-banner"></div>
    <div class="container">
        <div class="card" onclick="showM(true)">
            <h3>Участник</h3>
            <p>Вход в личный кабинет и поиск процедур</p>
        </div>
        <div class="card" onclick="showM(true)" style="border-color: var(--primary);">
            <h3>Регистрация</h3>
            <p>Аккредитация в системе за 24 часа</p>
        </div>
        <div class="card" onclick="showM(true)">
            <h3>Организатор</h3>
            <p>Размещение лотов и проведение торгов</p>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 ЭТП ЭРА. Электронная торговая площадка. Все права защищены.</p>
</footer>

<div id="m-window" class="modal-overlay">
    <div class="modal-box">
        <span class="x-close" onclick="showM(false)">&times;</span>
        <h2>Авторизация</h2>
        <div class="type-toggle">
            <div id="m-org" class="t-btn active" onclick="setT('org')">ЮР. ЛИЦО</div>
            <div id="m-fiz" class="t-btn" onclick="setT('fiz')">ФИЗ. ЛИЦО</div>
        </div>
        <div class="input-item">
            <label id="l-id">ИНН ОРГАНИЗАЦИИ</label>
            <input type="text" id="i-id" placeholder="10 или 12 цифр">
        </div>
        <div class="input-item">
            <label>ПАРОЛЬ</label>
            <input type="password" placeholder="********">
        </div>
        <button class="btn-go" onclick="showM(false)">ВОЙТИ</button>
    </div>
</div>

<script>
    function tick() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('ru-RU', {timeZone: 'Europe/Moscow'}); }
    setInterval(tick, 1000); tick();
    function showM(s) { document.getElementById('m-window').style.display = s ? 'flex' : 'none'; }
    function setT(t) {
        const isOrg = t === 'org';
        document.getElementById('m-org').className = 't-btn' + (isOrg ? ' active' : '');
        document.getElementById('m-fiz').className = 't-btn' + (!isOrg ? ' active' : '');
        document.getElementById('l-id').innerText = isOrg ? 'ИНН ОРГАНИЗАЦИИ' : 'СНИЛС / ИНН ФИЗЛИЦА';
        document.getElementById('i-id').placeholder = isOrg ? '10 или 12 цифр' : 'ХХХ-ХХХ-ХХХ ХХ';
    }
    window.onclick = function(e) { if (e.target.className === 'modal-overlay') showM(false); }
</script>

</body>
</html>
