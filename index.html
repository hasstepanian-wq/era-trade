<div id="tab-fin" class="tab-content">
    <h1>Управление финансами</h1>
    
    <div class="fin-grid">
        <div class="balance-card">
            <p style="text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); font-size: 12px;">Доступный баланс</p>
            <div class="balance-amount" id="current-balance">450 000.00 ₽</div>
            <p style="color: #10b981; font-size: 14px;">Ваш ID: <strong id="user-id">ERA-77412</strong></p>
        </div>

        <div class="deposit-form">
            <h3 style="margin-bottom: 20px;">Пополнение счета</h3>
            <div class="input-group">
                <label>Сумма пополнения (₽)</label>
                <input type="number" id="deposit-amount" placeholder="Введите сумму" value="50000">
            </div>
            <div class="input-group">
                <label>Способ оплаты</label>
                <select id="payment-method" onchange="toggleRequisites()" style="width: 100%; padding: 12px; background: #01040a; border: 1px solid #1e293b; border-radius: 8px; color: #fff;">
                    <option value="card">Банковская карта / СБП</option>
                    <option value="invoice">Безналичный расчет (Счет на оплату)</option>
                </select>
            </div>

            <div id="requisites-block" style="display:none; margin-top:20px; padding:15px; background: rgba(0,153,213,0.1); border: 1px dashed var(--primary); border-radius:10px;">
                <p style="font-size:13px; margin-bottom:10px; color:var(--primary);"><strong>Реквизиты для перевода:</strong></p>
                <div style="font-size:12px; line-height:1.6; color:#cbd5e0;">
                    Получатель: ООО "ЭТП ЭРА"<br>
                    ИНН: 7700112233 / КПП: 770001001<br>
                    Р/с: 40702810900001234567<br>
                    Банк: ПАО СБЕРБАНК<br>
                    БИК: 044525225<br>
                    <div style="margin-top:10px; padding:8px; background:#000; border-radius:5px;">
                        <strong>Назначение платежа:</strong><br>
                        Пополнение счета в ЭТП ЭРА для ID: <span style="color:var(--primary); font-weight:bold;">ERA-77412</span>
                    </div>
                </div>
                <button class="btn-action" style="margin-top:15px; background:#1e293b; font-size:12px;" onclick="window.print()">Скачать счет (PDF)</button>
            </div>

            <button id="main-deposit-btn" class="btn-action" style="margin-top:20px;" onclick="processDeposit()">Подтвердить оплату</button>
        </div>
    </div>
</div>

<script>
    function toggleRequisites() {
        const method = document.getElementById('payment-method').value;
        const reqBlock = document.getElementById('requisites-block');
        const mainBtn = document.getElementById('main-deposit-btn');
        
        if (method === 'invoice') {
            reqBlock.style.display = 'block';
            mainBtn.innerText = "Уведомить об оплате";
        } else {
            reqBlock.style.display = 'none';
            mainBtn.innerText = "Пополнить баланс";
        }
    }

    // Остальные функции (processDeposit и т.д.) остаются прежними
</script>
