<script>
    const uID = "ERA-77412";

    // ЖИВЫЕ ЧАСЫ
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.side-item').forEach(s => s.classList.remove('active'));
        document.getElementById('v-' + id).classList.add('active');
        document.getElementById('m-' + id).classList.add('active');
    }

    function openApp() {
        document.getElementById('modal-text').innerText = "Вход в систему под ID: " + uID;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('landing').style.display = 'none';
        document.getElementById('main-app').style.display = 'grid';
    }

    function logout() { location.reload(); }

    function generateInvoice() {
        const amount = document.getElementById('pay-amount').value;
        const method = document.getElementById('pay-method').value;

        if (method !== 'bank') {
            alert("Перенаправление на шлюз оплаты картой...");
            return;
        }

        const invNum = Math.floor(Math.random() * 9000 + 1000);
        const date = new Date().toLocaleDateString();

        const invoiceHtml = `
            <!DOCTYPE html>
            <html lang="ru">
            <head>
                <meta charset="UTF-8">
                <title>Счет на оплату №${invNum}</title>
                <style>
                    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 60px; line-height: 1.6; color: #000; background: #fff; }
                    .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 30px; }
                    .section { margin-bottom: 20px; }
                    .label { font-weight: bold; width: 150px; display: inline-block; }
                    table { width: 100%; border-collapse: collapse; margin: 30px 0; }
                    th, td { border: 1px solid #000; padding: 12px; text-align: left; }
                    th { background: #f2f2f2; }
                    .total { font-size: 18px; font-weight: bold; text-align: right; margin-top: 10px; }
                    .note { margin-top: 40px; font-style: italic; font-size: 14px; border-top: 1px solid #eee; padding-top: 10px; }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1 style="margin:0;">СЧЕТ НА ОПЛАТУ №${invNum}</h1>
                    <p style="margin:5px 0;">от ${date}</p>
                </div>

                <div class="section">
                    <p><strong>Поставщик:</strong> ООО «Форсаж»</p>
                    <p>ИНН 7728282160, КПП 773001001</p>
                    <p>Адрес: 121059, г.Москва, ул.Киевская, д.14, оф.2а</p>
                </div>

                <div class="section">
                    <p><strong>Банк получателя:</strong> ООО «Банк Точка»</p>
                    <p>БИК 044525104</p>
                    <p>К/С 30101810745374525104</p>
                    <p>Р/С 40702810101500033019</p>
                </div>

                <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">

                <div class="section">
                    <p><strong>Плательщик:</strong> Артур Степанян (ID пользователя: ${uID})</p>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Наименование товара / услуги</th>
                            <th style="width: 150px;">Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Пополнение баланса лицевого счета ЭТП-Эра (ID: ${uID})</td>
                            <td>${Number(amount).toLocaleString('ru-RU')}.00 руб.</td>
                        </tr>
                    </tbody>
                </table>

                <div class="total">Итого к оплате: ${Number(amount).toLocaleString('ru-RU')}.00 руб.</div>

                <div class="note">
                    <strong>Назначение платежа:</strong> Пополнение баланса лицевого счета ЭТП-Эра, ID пользователя ${uID}. НДС не облагается.
                </div>
            </body>
            </html>
        `;

        const win = window.open("", "_blank");
        win.document.write(invoiceHtml);
        win.document.close();
    }
</script>
