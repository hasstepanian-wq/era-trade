<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭТП ЭРА</title>
    <style>
        :root { --primary: #0099d5; --dark-bg: #06162c; }
        
        html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background: var(--dark-bg); color: #fff; }
        body { display: flex; flex-direction: column; }

        /* ХЕДЕР: ЛОГО И ВРЕМЯ СЛЕВА + МЕНЮ */
        header {
            background: #ffffff; padding: 10px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .header-left { display: flex; align-items: center; gap: 30px; }
        .logo-group { display: flex; flex-direction: column; }
        .logo-img { height: 55px; width: auto; display: block; }
        .server-time { font-family: monospace; font-size: 14px; color: #1a202c; font-weight: 900; }

        .nav-menu { display: flex; gap: 25px; }
        .nav-menu a { color: #1a202c; text-decoration: none; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .nav-menu a:hover { color: var(--primary); }

        .btn-top { background: var(--primary); color: #fff; padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }

        /* БАННЕР */
        .hero { width: 100%; height: 350px; background: url('sky_banner.jpg') no-repeat center center; background-size: cover; flex-shrink: 0; }

        /* ПЛИТКА */
        main { flex: 1 0 auto; padding-bottom: 50px; }
        .container { max-width: 1200px; margin: -40px auto 0; display: flex; justify-content: center; gap: 20px; padding: 0 20px; }
        .card {
            background: #0a1f3d; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; border-radius: 4px; transition: 0.3s; cursor: pointer;
            text-align: center; width: 33%; min-height: 180px; box-sizing: border-box;
        }
        .card:hover { border-color: var(--primary); background: #0d284d; }
        .card h3 { color: var(--primary); margin: 0 0 10px 0; text-transform: uppercase; }

        /* ФУТЕР */
        footer { flex-shrink: 0; background: #030a16; padding: 25px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; font-size: 13px; color: #94a3b8; }

        /* УНИВЕРСАЛЬНАЯ МОДАЛКА */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: #fff; color: #1a202c; padding: 30px; border-radius: 4px; width: 90%; max-width: 450px; position: relative; }
        
        .modal-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #999; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #4a5568; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }

        .btn-main { background: var(--primary); color: #fff; border: none; width: 100%; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .close-x { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 24px; color: #ccc; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="logo-group">
            <img src="logo-forsage-modified.png" alt="ФОРСАЖ" class="logo-img">
            <div class="server-time" id="clock">00:00:00</div>
        </div>
        <nav class="nav-menu">
            <a href="#">Торги</a>
            <a href="#">Комиссионная продажа</a>
        </nav>
    </div>
    <button class="btn-top" onclick="openModal('login')">ВХОД / РЕГИСТРАЦИЯ</button>
</header>

<main>
    <div class="hero"></div>
    <div class="container">
        <div class="card" onclick="openModal('reg')">
            <h3>Регистрация</h3>
            <p>Стать участником системы за 24 часа</p>
        </div>
        <div class="card" onclick="openModal('login')">
            <h3>Участник</h3>
            <p>Вход в личный кабинет</p>
        </div>
        <div class="card" onclick="openModal('login')">
            <h3>Организатор</h3>
            <p>Управление торгами</p>
        </div>
    </div>
</main>

<footer>
    &copy; 2026 ЭТП ЭРА. Электронная торговая площадка. Все права защищены.
</footer>

<div id="modal" class="modal-overlay">
    <div class="modal-box">
        <span class="close-x" onclick="closeModal()">&times;</span>
        <div class="modal-tabs">
            <div id="tab-login" class="tab" onclick="setMode('login')">ВХОД</div>
            <div id="tab-reg" class="tab" onclick="setMode('reg')">РЕГИСТРАЦИЯ</div>
        </div>

        <div id="form-content">
            </div>
        <button class="btn-main" id="submit-btn">ОТПРАВИТЬ</button>
    </div>
</div>

<script>
    function tick() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('ru-RU', {timeZone: 'Europe/Moscow'}); }
    setInterval(tick, 1000); tick();

    let currentMode = 'login';

    function openModal(mode) {
        document.getElementById('modal').style.display = 'flex';
        setMode(mode);
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('tab-login').className = 'tab' + (mode === 'login' ? ' active' : '');
        document.getElementById('tab-reg').className = 'tab' + (mode === 'reg' ? ' active' : '');
        
        const content = document.getElementById('form-content');
        const btn = document.getElementById('submit-btn');

        if (mode === 'login') {
            content.innerHTML = `
                <div class="form-group"><label>ЛОГИН / ИНН</label><input type="text" placeholder="Введите данные"></div>
                <div class="form-group"><label>ПАРОЛЬ</label><input type="password" placeholder="********"></div>
            `;
            btn.innerText = 'ВОЙТИ';
        } else {
            content.innerHTML = `
                <div class="form-group"><label>ИНН ОРГАНИЗАЦИИ / ФИЗЛИЦА</label><input type="text" placeholder="10 или 12 цифр"></div>
                <div class="form-group"><label>EMAIL</label><input type="email" placeholder="example@mail.ru"></div>
                <div class="form-group"><label>ТЕЛЕФОН</label><input type="text" placeholder="+7 (___) ___+__-__"></div>
            `;
            btn.innerText = 'ЗАРЕГИСТРИРОВАТЬСЯ';
        }
    }

    window.onclick = function(e) { if (e.target.className === 'modal-overlay') closeModal(); }
</script>

</body>
</html>
